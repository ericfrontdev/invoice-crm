name: Nettoyage des logs de webhooks

# Le site est hébergé sur Netlify, qui n'a pas d'équivalent de vercel.json pour
# les crons. On appelle donc l'endpoint depuis GitHub Actions.
on:
  schedule:
    - cron: '0 2 * * *' # tous les jours à 2h UTC
  workflow_dispatch: # permet un déclenchement manuel

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/webhooks/cleanup
        env:
          APP_URL: ${{ vars.APP_URL || 'https://solopack.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas configuré dans le dépôt."
            exit 1
          fi

          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/webhooks/cleanup")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Le nettoyage a échoué (HTTP $status)."
            exit 1
          fi
